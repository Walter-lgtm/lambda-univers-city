<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>λ — Univers City Terminal</title>
    <style>
        :root { 
            --orange: #ff8c00; 
            --dark-orange: #8b4513;
            --bg: #050505; 
            --surface: #111;
        }

        body { 
            background: var(--bg); 
            color: #eee; 
            font-family: 'Courier New', monospace; 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent;
        }

        /* Фиксированная шапка для смартфонов */
        .sticky-header {
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.95);
            border-bottom: 2px solid var(--orange);
            padding: 10px 15px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .lambda-icon {
            width: 40px;
            height: 40px;
            border: 2px solid var(--orange);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--orange);
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 0 10px var(--orange);
        }

        #timer {
            font-size: 22px;
            color: var(--orange);
            font-weight: bold;
            text-shadow: 0 0 8px var(--orange);
        }

        /* Контейнер таблицы с горизонтальным скроллом */
        .table-viewport {
            width: 100%;
            overflow-x: auto;
            padding: 20px 0;
            background: radial-gradient(circle, #1a1a1a 0%, #050505 100%);
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 60px);
            grid-auto-rows: 70px;
            gap: 5px;
            padding: 10px;
            width: max-content; /* Чтобы не сжималась */
        }

        .element {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.1s;
        }

        .element.active-quest {
            border-color: var(--orange);
            background: rgba(255, 140, 0, 0.1);
            box-shadow: inset 0 0 10px var(--orange);
        }

        .element:active {
            transform: scale(0.9);
            background: var(--orange);
        }

        .num { font-size: 10px; position: absolute; top: 4px; left: 6px; color: var(--orange); }
        .sym { font-size: 18px; font-weight: bold; }
        .name { font-size: 7px; text-transform: uppercase; text-align: center; }

        /* Всплывающая панель данных (Bottom Sheet) */
        #details {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            border-top: 3px solid var(--orange);
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 200;
        }

        #details.open { transform: translateY(0); }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: var(--orange);
            font-size: 20px;
        }

        .data-row { margin: 8px 0; font-size: 14px; border-bottom: 1px solid #222; }
        .data-label { color: var(--orange); margin-right: 10px; }
        /* Добавь это к стилям */
#main-menu {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 500;
}

.menu-button {
    width: 80%;
    padding: 15px;
    margin: 10px;
    border: 1px solid var(--orange);
    color: var(--orange);
    background: transparent;
    font-family: 'Courier New', monospace;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 0 5px var(--orange);
}

.menu-button:disabled {
    border-color: #444;
    color: #444;
    box-shadow: none;
}

.input-field {
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--orange);
    color: #fff;
    padding: 10px;
    margin-bottom: 20px;
    text-align: center;
    font-family: 'Courier New', monospace;
}
    </style>

        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.type = 'square';
        oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.05);

    function buildTable() {
        const table = document.getElementById('table');
        elements.forEach(el => {
            const div = document.createElement('div');
            const isQuest = questTargets.includes(el.n);
            div.className = 'element' + (isQuest ? ' active-quest' : '');
            div.style.gridColumn = el.x;
            div.style.gridRow = el.y;
            
            div.innerHTML = `
                <span class="num">${el.n}</span>
                <span class="sym">${el.s}</span>
                <span class="name">${el.name}</span>
            `;

            div.onclick = () => {
                playHevClick();
                showDetails(el);
                if(isQuest) handleQuestLogic(el.n, div);
            };
            table.appendChild(div);
        });
    }

    function showDetails(el) {
        const panel = document.getElementById('details');
        const content = document.getElementById('content');
        content.innerHTML = `
            <h2 style="color:var(--orange); margin-top:0;">[ АНАЛИЗ ОБЪЕКТА: ${el.s} ]</h2>
            <div class="data-row"><span class="data-label">ИМЯ:</span> ${el.name}</div>
            <div class="data-row"><span class="data-label">ЛАТИНЬ:</span> ${el.lat}</div>
            <div class="data-row"><span class="data-label">МАССА:</span> ${el.m}</div>
            <div class="data-row"><span class="data-label">ЗАРЯД:</span> +${el.n}</div>
            <div class="data-row"><span class="data-label">КОНФИГУРАЦИЯ:</span><br>${el.c}</div>
        `;
        panel.classList.add('open');
    }

    function closeDetails() {
        document.getElementById('details').classList.remove('open');
    }

    function handleQuestLogic(id, elementDiv) {
        if (!elementDiv.classList.contains('stabilized')) {
            elementDiv.classList.add('stabilized');
            elementDiv.style.background = "var(--orange)";
            discovered++;
            if(discovered === 4) {
                document.getElementById('status-text').innerText = "КРИТИЧЕСКАЯ МАССА ДОСТИГНУТА";
                document.getElementById('status-text').style.color = "#00ff00";
            }
        }
    }

    // Таймер
    let timeLeft = 900;
    const timerDisplay = document.getElementById('timer');
    setInterval(() => {
        if (timeLeft <= 0) return;
        timeLeft--;
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        timerDisplay.innerText = `${m}:${s < 10 ? '0' + s : s}`;
    }, 1000);

    buildTable();
