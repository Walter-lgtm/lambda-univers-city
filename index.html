<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>λ — Univers City Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="state-menu">
        <div class="lambda-logo">λ</div>
        <h2 style="color:var(--orange)">SYSTEM_ACCESS_GRANTED</h2>
        <input type="text" id="player-name" class="input-field" placeholder="ВВЕДИТЕ ВАШ НИКНЕЙМ">
        <button class="menu-button" onclick="setState('GAME')">СЕКТОР C: ПСХЭ-СТАБИЛИЗАЦИЯ</button>
    </div>

    <div id="state-game" style="display:none">
        <div class="sticky-header">
            <div class="lambda-icon">λ</div>
            <div id="timer">15:00</div>
        </div>
        <div class="table-viewport"><div class="periodic-table" id="table"></div></div>
    </div>

    <div id="state-win" style="display:none">
        <h1 class="win-title">ПОРТАЛ ЗАКРЫТ</h1>
        <div class="win-code">HL-SINGULARITY-106</div>
    </div>

    <div id="details"><span class="close-btn" onclick="closeDetails()">✕</span><div id="content"></div></div>

    <!-- Подключаем скрипты -->
    <script src="periodic-table.js"></script>
    <script src="quest-engine.js"></script>
</body>
</html>
